# 테넌트 스키마 전용 Alembic 설정
# 사용: uv run alembic -c alembic_tenant.ini [command]

[alembic]
script_location = %(here)s/alembic_tenant
prepend_sys_path = .
path_separator = os

# sqlalchemy.url은 env.py에서 settings.database_url로 동적 설정
# sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
