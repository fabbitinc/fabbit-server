[pytest]
minversion = 8.0
python_files = test_*.py

markers =
    unit: 메서드 단위 테스트
    e2e: 서버 API 시나리오 테스트
    llm_api: e2e 중 LLM 호출 API 케이스
    eval: 모델/프롬프트 평가(기본 제외)
    costly: 비용/시간이 큰 테스트(기본 제외)

addopts = --import-mode=importlib -m "not eval and not costly"

# 기본적으로 test2 하위만 수집
# 필요 시 명시적으로 경로를 지정해 실행한다.
testpaths =
    unit
    e2e
    llm
