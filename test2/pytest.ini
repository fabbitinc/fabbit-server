[pytest]
minversion = 8.0
python_files = test_*.py

markers =
    unit: 메서드 단위 테스트
    e2e: e2e core + external 공통 테스트
    external: e2e external 전용 테스트
    llm_eval: 모델/프롬프트 평가 테스트
    smoke_httpx: 네트워크 경계 검증 스모크 테스트
    costly: 비용/시간이 큰 테스트

addopts = --import-mode=importlib -m "not external and not llm_eval and not costly and not smoke_httpx"

# 기본적으로 test2 하위만 수집
# 필요 시 명시적으로 경로를 지정해 실행한다.
testpaths =
    unit
    e2e
    llm_eval
