[project]
name = "fabbit-server"
version = "0.1.0"
description = "AI 기반 제조업 온톨로지 엔진"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.5",
    "httpx>=0.28.1",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "psycopg2-binary>=2.9.11",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.12.0",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.40.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "chardet>=5.0.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.3",
    # OpenTelemetry
    "opentelemetry-api>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    # JWT 인증
    "pyjwt>=2.11.0",
    # 패스워드 해싱
    "bcrypt>=4.2.0",
    # 이메일 검증 (Pydantic EmailStr)
    "email-validator>=2.0.0",
    # UUID v7 (시간순 정렬 PK)
    "uuid-utils>=0.9.0",
    # S3 스토리지
    "boto3>=1.42.42",
    # 도면 분석 (PDF→이미지 변환, 이미지 리사이징)
    "PyMuPDF>=1.24.0",
    "Pillow>=10.0.0",
]
