services:
  fabbit-database:
    image: apache/age:release_PG18_1.7.0
    restart: unless-stopped
    cpus: 0.75
    mem_reservation: 1g
    mem_limit: 3g
    networks:
      - default
      - dokploy-network
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fabbit-server}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-fabbit}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=ko-KR"
    volumes:
      - ./initdb.d:/docker-entrypoint-initdb.d:ro
      - fabbit-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fabbit} -d $${POSTGRES_DB:-fabbit}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fabbit-db-data:

networks:
  dokploy-network:
    external: true
