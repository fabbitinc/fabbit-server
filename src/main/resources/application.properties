# 애플리케이션 기본 설정
server.port=${PORT:10010}
spring.application.name=server
spring.config.import=optional:file:.env[.properties]

# 도메인 및 초대 링크 설정
app.base-domain=${BASE_DOMAIN:lvh.me}
app.invitation-base-url=${INVITATION_BASE_URL:http://localhost:20010}
app.invitation-expire-days=${INVITATION_EXPIRE_DAYS:7}

# 메일 발송 설정
app.smtp-host=${SMTP_HOST:localhost}
app.smtp-port=${SMTP_PORT:1025}
app.smtp-username=${SMTP_USERNAME:}
app.smtp-password=${SMTP_PASSWORD:}
app.smtp-use-tls=${SMTP_USE_TLS:false}
app.smtp-from-email=${SMTP_FROM_EMAIL:noreply@fabbit.io}
app.smtp-from-name=${SMTP_FROM_NAME:Fabbit}

# 사용자 검증 설정
app.email-verification-expire-minutes=${EMAIL_VERIFICATION_EXPIRE_MINUTES:10}
app.email-verification-max-attempts=${EMAIL_VERIFICATION_MAX_ATTEMPTS:5}
app.email-verification-cooldown-seconds=${EMAIL_VERIFICATION_COOLDOWN_SECONDS:10}
app.turnstile-enabled=${TURNSTILE_ENABLED:false}
app.turnstile-secret-key=${TURNSTILE_SECRET_KEY:}
app.turnstile-verify-url=${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}

# 인증 설정
app.jwt.secret-key=${JWT_SECRET_KEY:change-me-in-production}
app.jwt.issuer=${JWT_ISSUER:fabbit}
app.jwt.access-token-expire-minutes=${ACCESS_TOKEN_EXPIRE_MINUTES:15}
app.jwt.refresh-token-expire-days=${REFRESH_TOKEN_EXPIRE_DAYS:7}

# 개발 보조 설정
app.dev-layer-call-log.enabled=${APP_DEV_LAYER_CALL_LOG_ENABLED:false}

# 파일 저장소 설정
app.storage-endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
app.storage-access-key=${STORAGE_ACCESS_KEY:minioadmin}
app.storage-secret-key=${STORAGE_SECRET_KEY:minioadmin}
app.storage-bucket=${STORAGE_BUCKET:fabbit}
app.storage-public-url=${STORAGE_PUBLIC_URL:}
app.storage-read-url-expire-minutes=${STORAGE_READ_URL_EXPIRE_MINUTES:15}

# 도면 변환 설정
app.drawing-converter.qcad-path=${QCAD_PATH:/Applications/QCAD.app/Contents/Resources}
app.drawing-converter.ezdxf-bin-path=${EZDXF_BIN_PATH:}
app.drawing-converter.max-concurrent=${CONVERTER_MAX_CONCURRENT:1}
app.drawing-converter.temp-dir=${CONVERTER_TEMP_DIR:/tmp/drawing-converter}
app.drawing-converter.three-d-converter-bin-path=${THREE_D_CONVERTER_BIN_PATH:}
app.drawing-converter.command-timeout-seconds=${CONVERTER_COMMAND_TIMEOUT_SECONDS:300}
app.drawing-converter.pipeline-timeout-seconds=${CONVERTER_PIPELINE_TIMEOUT_SECONDS:420}
app.drawing-converter.temp-dir-cleanup-max-age-hours=${CONVERTER_TEMP_DIR_CLEANUP_MAX_AGE_HOURS:24}
app.drawing-converter.temp-dir-cleanup-cron=${CONVERTER_TEMP_DIR_CLEANUP_CRON:0 0 * * * *}

# LLM 연동 설정
app.llm-api-key=${LLM_API_KEY:}
app.llm-enabled=${LLM_ENABLED:true}
app.llm-base-url=${LLM_BASE_URL:https://openrouter.ai/api/v1}
app.llm-model=${LLM_MODEL:openai/gpt-5.4-nano}
app.llm-timeout-seconds=${LLM_TIMEOUT_SECONDS:30}
app.llm-guard-model=${LLM_GUARD_MODEL:openai/gpt-5.4-nano}

# Spring AI 설정
spring.ai.model.chat=openai
spring.ai.chat.client.enabled=true
spring.ai.openai.api-key=${LLM_API_KEY:disabled}
spring.ai.openai.base-url=${LLM_BASE_URL:https://openrouter.ai/api/v1}
spring.ai.openai.chat.completions-path=/chat/completions
spring.ai.openai.chat.options.model=${LLM_MODEL:openai/gpt-5.4-nano}

# 데이터베이스 설정
spring.datasource.url=${DB_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:fabbit}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USER:fabbit}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:fabbit}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'; SET statement_timeout = '30s'

# JPA 및 마이그레이션 설정
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.liquibase.enabled=false

# Hibernate 로그 설정
logging.level.org.hibernate=OFF
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# API 문서 설정
springdoc.api-docs.path=/openapi.json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/openapi.json

# 직렬화 설정
spring.jackson.property-naming-strategy=SNAKE_CASE
